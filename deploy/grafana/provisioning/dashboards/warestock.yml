# Grafana dashboard provisioning (issue #14).
# Points Grafana at the dashboard template committed in backend/grafana/, which
# docker-compose.yml mounts read-only at /var/lib/grafana/dashboards.

apiVersion: 1

providers:
  - name: warestock
    orgId: 1
    folder: WareStock
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
