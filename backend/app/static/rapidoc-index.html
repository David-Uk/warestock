<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WareStock AI - RapiDoc</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
  <rapi-doc
    spec-url="/openapi.json"
    theme="light"
    render-style="focused"
    show-header="false"
    show-info="true"
    allow-authentication="true"
    allow-server-selection="true"
    default-schema-tab="schema"
    schema-style="table"
    schema-expand-level="2"
    font-size="default"
    sort-tags="true"
  ></rapi-doc>
  <script src="/static/rapidoc/rapidoc-min.js"></script>
</body>
</html>
